[package]
name = "peersig-probe"
description = "PeerSig capture daemon: ties each TLS/QUIC/DTLS ClientHello's JA4 to the application that sent it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
pcap = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
# Fingerprints and QUIC Initial decryption (RFC 9001 / RFC 9369)
sha2 = "0.10"
md5 = "0.7"
hkdf = "0.12"
aes = "0.8"
aes-gcm = "0.10"
# Executable inspection (Mach-O now; ELF and PE for Linux and Windows later)
goblin = "0.9"
memmap2 = "0.9"
plist = "1"
libc = "0.2"
