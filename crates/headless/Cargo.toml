[package]
name = "peersig-headless"
description = "PeerSig without a desktop: the `peersig` command, for participants and dedicated observers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "peersig"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
peersig-proto = { path = "../proto", features = ["client"] }
rand = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }

[dev-dependencies]
axum = "0.8.9"
peersig-server = { path = "../server" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
