[package]
name = "peersig-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
hmac = "0.12"
# Codes by e-mail: SMTP, with the TLS stack reqwest already uses.
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
peersig-proto = { version = "0.1.0", path = "../proto" }
rand = "0.10"
# Codes with a GitHub account: OAuth.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
peersig-proto = { path = "../proto", features = ["client"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
