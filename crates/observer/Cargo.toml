[package]
name = "peersig-observer"
description = "PeerSig dedicated observer: sends a machine's daily report from the command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
peersig-proto = { path = "../proto", features = ["client"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }

[dev-dependencies]
axum = "0.8.9"
peersig-server = { path = "../server" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
