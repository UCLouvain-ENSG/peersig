name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Probe, protocol, server, relay (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: cargo test --locked
      # The headless packages: built from debug binaries, installed, checked.
      - if: runner.os == 'Linux'
        name: Headless packages
        run: |
          sudo apt-get install -y patchelf
          curl -sSfL -o "$RUNNER_TEMP/nfpm.deb" https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb
          sudo apt-get install -y "$RUNNER_TEMP/nfpm.deb"
          cargo build --locked -p peersig-probe -p peersig-headless
          crates/headless/packaging/build.sh target/debug dist 0.0.0
          sudo apt-get install -y ./dist/peersig-headless_0.0.0_amd64.deb
          sudo crates/headless/packaging/smoke.sh

  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev
      - name: Probe sidecar
        run: |
          cargo build --locked --release -p peersig-probe
          cp target/release/peersig-probe crates/app/binaries/peersig-probe-$(rustc -vV | sed -n 's/host: //p')
      - run: cargo test --locked -p peersig-app
      - run: node --check crates/app/ui/app.js

  android:
    name: Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      # The native side's tests run on the runner itself.
      - run: cargo test --locked -p peersig-android -p ipstack
      - name: NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -Ppeersig.abis=arm64-v8a
      - run: node --check android/app/src/main/ui/android.js
      - uses: actions/upload-artifact@v4
        with:
          name: peersig-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Probe, protocol, server, relay, app (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Probe sidecar
        shell: bash
        run: |
          cargo build --locked --release -p peersig-probe
          cp target/release/peersig-probe.exe crates/app/binaries/peersig-probe-$(rustc -vV | sed -n 's/host: //p').exe
      - run: cargo test --locked -p peersig-app
