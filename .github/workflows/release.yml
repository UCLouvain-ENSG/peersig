name: Release

# Push a tag v<version> (the version in Cargo.toml and crates/app/tauri.conf.json).
# Everything lands in a draft release: check it, then publish it on GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Versions match the tag
        run: |
          v=${TAG#v}
          grep -q "^version = \"$v\"" Cargo.toml || { echo "Cargo.toml is not at $v"; exit 1; }
          grep -q "\"version\": \"$v\"" crates/app/tauri.conf.json || { echo "tauri.conf.json is not at $v"; exit 1; }
      - name: Draft release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "PeerSig $TAG" --notes-file .github/release-notes.md

  app:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, bundles: 'app,dmg' }
          - { os: macos-latest, target: x86_64-apple-darwin, bundles: 'app,dmg' }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'deb,appimage' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: 'msi' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libfuse2 patchelf
      - name: Probe sidecar
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cargo build --locked --release -p peersig-probe --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/peersig-probe$ext crates/app/binaries/peersig-probe-${{ matrix.target }}$ext
      # Apple's on-device model for the review (crates/app/hint): Xcode 26 or later.
      - if: runner.os == 'macOS'
        name: Model helper
        run: crates/app/hint/build.sh ${{ matrix.target }}
      - name: Build the app
        working-directory: crates/app
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Sign and notarize only when the secrets exist (see docs/deploy.md).
          if [ -n "$S_APPLE_CERTIFICATE" ]; then
            export APPLE_CERTIFICATE="$S_APPLE_CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$S_APPLE_CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$S_APPLE_SIGNING_IDENTITY" APPLE_ID="$S_APPLE_ID"
            export APPLE_PASSWORD="$S_APPLE_PASSWORD" APPLE_TEAM_ID="$S_APPLE_TEAM_ID"
          fi
          npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      # Debian names libpcap's library libpcap.so.0.8; Fedora, RHEL and
      # openSUSE keep its own name, libpcap.so.1. Same library: the RPM's
      # probe asks for that name.
      - if: runner.os == 'Linux'
        name: RPM
        working-directory: crates/app
        run: |
          patchelf --replace-needed libpcap.so.0.8 libpcap.so.1 binaries/peersig-probe-${{ matrix.target }}
          patchelf --print-needed binaries/peersig-probe-${{ matrix.target }} | grep -Fx libpcap.so.1
          npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles rpm
      - name: Upload
        run: |
          cd target/${{ matrix.target }}/release/bundle
          files=$(ls dmg/*.dmg deb/*.deb rpm/*.rpm appimage/*.AppImage msi/*.msi 2>/dev/null || true)
          test -n "$files"
          gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"

  linux-binaries:
    needs: draft
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev patchelf
      - run: cargo build --locked --release -p peersig-server -p peersig-relay -p peersig-probe -p peersig-headless
      # PeerSig without a desktop: .deb and .rpm, installed and checked here.
      - name: Headless packages
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nfpm.deb" https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb
          sudo apt-get install -y "$RUNNER_TEMP/nfpm.deb"
          crates/headless/packaging/build.sh target/release dist "${TAG#v}"
          sudo apt-get install -y ./dist/peersig-headless_*_amd64.deb
          sudo crates/headless/packaging/smoke.sh
      - name: Upload
        run: |
          d=peersig-$TAG-linux-x86_64
          mkdir $d
          cp target/release/peersig-server target/release/peersig-relay target/release/peersig-probe target/release/peersig README.md LICENSE docs/headless.md docs/observers.md $d/
          tar -czf $d.tar.gz $d
          gh release upload "$TAG" $d.tar.gz dist/peersig-headless_*_amd64.deb dist/peersig-headless-*.x86_64.rpm --clobber --repo "$GITHUB_REPOSITORY"

  # The Android app, signed with the study's key (docs/android.md): Android
  # updates an app only with the key it was installed with. Without the
  # secrets it is built, not attached.
  android:
    needs: draft
    runs-on: ubuntu-22.04
    env:
      S_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      S_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      S_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      S_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build
        working-directory: android
        run: |
          set -- --no-daemon assembleRelease
          if [ -n "$S_KEYSTORE" ]; then
            echo "$S_KEYSTORE" | base64 -d > "$RUNNER_TEMP/peersig.jks"
            set -- "$@" -Ppeersig.keystore="$RUNNER_TEMP/peersig.jks" -Ppeersig.keystorePassword="$S_KEYSTORE_PASSWORD" \
              -Ppeersig.keyAlias="$S_KEY_ALIAS" -Ppeersig.keyPassword="$S_KEY_PASSWORD"
          fi
          ./gradlew "$@"
      - name: Upload
        run: |
          if [ -z "$S_KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE secret: the APK is not attached (docs/android.md)"
            exit 0
          fi
          apk="PeerSig_${TAG#v}_android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "$TAG" "$apk" --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    needs: [app, linux-binaries, android]
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*'
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
