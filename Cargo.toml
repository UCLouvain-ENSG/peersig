[workspace]
resolver = "2"
members = ["crates/probe", "crates/proto", "crates/server", "crates/relay", "crates/observer", "crates/app"]
# The app needs a desktop toolchain (WebKit/GTK); build it with -p peersig-app.
default-members = ["crates/probe", "crates/proto", "crates/server", "crates/relay", "crates/observer"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/UCLouvain-ENSG/peersig"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Proc macros and build scripts are not stripped: on recent macOS toolchains,
# stripped proc-macro dylibs fail to load ("mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = false
