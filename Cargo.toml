[workspace]
resolver = "2"
members = ["crates/probe", "crates/proto", "crates/server", "crates/relay", "crates/headless", "crates/client", "crates/app", "crates/android"]
# The app needs a desktop toolchain (WebKit/GTK); build it with -p peersig-app.
# The Android app's library is built with cargo-ndk (docs/android.md); its
# host tests run with -p peersig-android.
default-members = ["crates/probe", "crates/proto", "crates/server", "crates/relay", "crates/headless", "crates/client"]

[workspace.package]
version = "0.1.13"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/UCLouvain-ENSG/peersig"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Proc macros and build scripts are not stripped: on recent macOS toolchains,
# stripped proc-macro dylibs fail to load ("mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = false
